{% extends "base.html" %}

{% block content %}

<style>

/* Page Title */
.title {
    text-align: center;
    margin-bottom: 25px;
    color: white;
}

/* Glass Card */
.predict-card {
    max-width: 550px;
    margin: auto;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
    animation: fadeIn 0.8s ease-in-out;
}

/* Inputs */
.form-control {
    background: rgba(255,255,255,0.08);
    border: none;
    color: white;
    border-radius: 10px;
    margin-bottom: 15px;
    padding: 12px;
}

/* Placeholder */
.form-control::placeholder {
    color: #d1d5db;
}

/* Focus */
.form-control:focus {
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 10px #38bdf8;
    color: white;
}

/* Select Option */
select option {
    color: black;
}

/* Button */
.btn-predict {
    width: 100%;
    border-radius: 30px;
    padding: 12px;
    border: none;
    background: linear-gradient(90deg, #38bdf8, #6366f1);
    color: white;
    font-weight: 600;
    transition: 0.3s;
}

/* Hover */
.btn-predict:hover {
    transform: scale(1.03);
    box-shadow: 0 0 15px rgba(56,189,248,0.7);
}

/* Result */
.result-box {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 18px;
    font-weight: bold;
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
