<!DOCTYPE html>
<html>
<head>
    <title>House Price Predictor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: white;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        .sidebar h3 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .sidebar a {
            display: block;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            color: #cbd5f5;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: rgba(56,189,248,0.15);
            color: white;
            transform: translateX(6px);
        }

        .sidebar a.active {
            background: linear-gradient(90deg, #38bdf8, #6366f1);
            color: white;
            box-shadow: 0 0 10px rgba(56,189,248,0.6);
        }

        .sidebar a.logout {
            margin-top: 20px;
            background: rgba(255, 0, 0, 0.1);
        }

        .sidebar a.logout:hover {
            background: rgba(255, 0, 0, 0.3);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 260px;
            padding: 25px;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        /* Scrollbar (optional premium touch) */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">
    <h3>🏠 House AI</h3>

    <a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">🏠 Dashboard</a>
    <a href="/predict-page" class="{% if request.path == '/predict-page' %}active{% endif %}">📋 Predict</a>
    <a href="/insights" class="{% if request.path == '/insights' %}active{% endif %}">📈 Insights</a>
    <a href="/about" class="{% if request.path == '/about' %}active{% endif %}">ℹ️ About</a>

    <a href="/logout" class="logout">🚪 Logout</a>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
